# On every push to master: build the single-binary release (UI embedded) for each platform and
# replace the assets of the "latest" GitHub release. No versions; the tag is moved to the new commit.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: ui
      - run: yarn build
        working-directory: ui
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --features embed-ui --target ${{ matrix.target }}
        working-directory: api
      - name: Package
        run: |
          mkdir -p out
          bin=api/target/${{ matrix.target }}/release/velocitempo
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "out/velocitempo-${{ matrix.name }}.zip" "./$bin.exe"
          else
            tar -czf "out/velocitempo-${{ matrix.name }}.tar.gz" -C "$(dirname "$bin")" velocitempo
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: velocitempo-${{ matrix.name }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: velocitempo-*
          path: out
          merge-multiple: true
      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          notes="Latest build of master, commit ${GITHUB_SHA::7}."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$notes" --latest
            gh release upload latest out/* --clobber
          else
            gh release create latest out/* --title "Latest build" --notes "$notes" --latest
          fi
